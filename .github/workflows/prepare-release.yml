name: Create release

# Manual release pipeline for ExtraVR. It bumps the workspace version, tags it,
# then builds the Windows streamer + Inno Setup installer and the Android client,
# attaching everything to a DRAFT GitHub release (nothing is published until you
# press "Publish" on the release page).
#
# The Android APK is only signed when the SIGNING_KEY/KEY_ALIAS/KEY_STORE_PASSWORD/
# KEY_PASSWORD secrets exist; otherwise an unsigned APK is attached instead.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0 (empty = keep the version already in Cargo.toml)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare_release:
    runs-on: windows-latest
    outputs:
      release_ref: ${{ steps.output_ref.outputs.release_ref }}
      version: ${{ steps.bump_version.outputs.version }}
      tag: ${{ steps.bump_version.outputs.tag }}
    steps:
      - name: Configure git
        run: |
          git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version
        id: bump_version
        env:
          RUST_BACKTRACE: 1
        run: |
          $versionArg = "${{ github.event.inputs.version }}"
          if ($versionArg.Length -gt 0) {
            cargo xtask bump --version $versionArg
          } else {
            cargo xtask bump
          }
          if ($LASTEXITCODE -ne 0) { throw "cargo xtask bump failed" }

          # Read the version back from the manifest so it always matches what was written
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          cargo update -p alvr_common

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT
          echo "Releasing ExtraVR v$version"

      - name: Push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            echo "Version unchanged, nothing to commit"
          } else {
            git commit -m "[Auto] Bump version to ${{ steps.bump_version.outputs.tag }}"
            git push
          }

      - name: Output ref for later checkouts
        id: output_ref
        run: echo "release_ref=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump_version.outputs.tag }}" `
            --draft `
            --title "ExtraVR ${{ steps.bump_version.outputs.tag }}" `
            --target "${{ steps.output_ref.outputs.release_ref }}" `
            --notes "ExtraVR ${{ steps.bump_version.outputs.tag }}"

  build_windows_installer:
    runs-on: windows-latest
    needs: [prepare_release]
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: choco install zip unzip pkgconfiglite innosetup -y

      - name: Build and package the streamer
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask package-streamer --gpl --ci

      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ needs.prepare_release.outputs.version }} `
            installer\ExtraVR.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload installer and portable archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.prepare_release.outputs.tag }}"
          $version = "${{ needs.prepare_release.outputs.version }}"
          Copy-Item build\alvr_streamer_windows.zip "build\ExtraVR-streamer-windows-$version.zip"
          gh release upload $tag `
            "build\ExtraVR-Setup-$version.exe" `
            "build\ExtraVR-streamer-windows-$version.zip" `
            --clobber

  build_android_client:
    runs-on: ubuntu-latest
    needs: [prepare_release]
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-32"
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Build and package the client
        env:
          RUST_BACKTRACE: 1
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo xtask package-client --ci

      - name: Sign APK
        uses: ilharp/sign-android-release@v1
        id: sign_apk
        if: env.SIGNING_KEY != ''
        with:
          releaseDir: build/alvr_client_android
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      - name: Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED_APK: ${{ steps.sign_apk.outputs.signedFile }}
        run: |
          version="${{ needs.prepare_release.outputs.version }}"
          if [ -n "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" "build/ExtraVR-client-android-$version.apk"
          else
            echo "::warning::No signing secrets configured — attaching an UNSIGNED APK"
            cp "$(find build/alvr_client_android -name '*.apk' | head -n1)" \
               "build/ExtraVR-client-android-$version-unsigned.apk"
          fi
          gh release upload "${{ needs.prepare_release.outputs.tag }}" \
            build/ExtraVR-client-android-*.apk --clobber
